# Development-side pre-commit config for THIS repo (contributors editing
# falco-py-pre-commit itself). Consumers of the *hooks* published by this repo
# do not need this file.
#
# Usage:
#   uvx pre-commit install       # wire into git hooks
#   uvx pre-commit run -a        # run every hook against all files
#   uvx pre-commit autoupdate    # bump the pins below
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
      - id: ruff-format
