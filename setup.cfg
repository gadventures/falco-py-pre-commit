[metadata]
name = falco-py-pre-commit
version = 2.3.0
description = A pip-installable falco (Fastly VCL linter) binary, packaged as pre-commit hooks
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/gadventures/falco-py-pre-commit
author = G Adventures
author_email = jprindiville@gadventures.com
license = MIT
license_files = LICENSE
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only

[options]
python_requires = >=3.9
packages = find:
setup_requires =
    setuptools-download

[options.entry_points]
console_scripts =
    falco-lint-all-changed = falco_py_pre_commit.lint:main

# The falco binary is downloaded and verified at build time, then installed
# into the environment's scripts directory (next to the console script above).
# Falco ships darwin/linux x amd64/arm64 only -- there is no Windows build.
# Regenerate this block for a new release with: bin/update-falco.sh vX.Y.Z
[setuptools_download]
download_scripts =
    [falco]
    group = falco-binary
    marker = sys_platform == "linux" and platform_machine == "x86_64"
    url = https://github.com/ysugimoto/falco/releases/download/v2.3.0/falco-linux-amd64.tar.gz
    sha256 = 9888d04cd63a6b1058ecf228997f7ee6a18480394bfa9e5e00c8d8f46d03d19f
    extract = tar
    extract_path = ./falco
    [falco]
    group = falco-binary
    marker = sys_platform == "linux" and platform_machine == "aarch64"
    url = https://github.com/ysugimoto/falco/releases/download/v2.3.0/falco-linux-arm64.tar.gz
    sha256 = b559fb0772fc280337b03c7b9d9221a0bd89c274c7d917f4c0832e1578d05dfa
    extract = tar
    extract_path = ./falco
    [falco]
    group = falco-binary
    marker = sys_platform == "darwin" and platform_machine == "x86_64"
    url = https://github.com/ysugimoto/falco/releases/download/v2.3.0/falco-darwin-amd64.tar.gz
    sha256 = e62caa67731876e288a92edc44acbd4d718992e8b0c5b85ebdf9f7f432ce05a8
    extract = tar
    extract_path = ./falco
    [falco]
    group = falco-binary
    marker = sys_platform == "darwin" and platform_machine == "arm64"
    url = https://github.com/ysugimoto/falco/releases/download/v2.3.0/falco-darwin-arm64.tar.gz
    sha256 = bddb89e465cb65d463986040c5d083c7d8eacaa4785655bfb8622c85e8cd0a8f
    extract = tar
    extract_path = ./falco
