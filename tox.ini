# `uvx tox` runs this: it builds the package into an isolated venv (which
# downloads + verifies + installs the pinned falco binary), then confirms the
# binary runs and lints a clean fixture. The richer regression test -- including
# the "bad file is detected even when not first" assertion, which tox cannot
# express (any non-zero command is a tox failure) -- lives in
# testing/smoke-test.sh.
[tox]
envlist = py

[testenv]
commands =
    falco --version
    falco-lint-all-changed {toxinidir}/testing/0_ok.vcl
